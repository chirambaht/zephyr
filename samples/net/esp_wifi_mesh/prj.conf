# ESP-WIFI-MESH sample configuration

# Core WiFi + mesh
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_ESP32_MESH=y

# Heap: mesh stack needs generous heap
CONFIG_HEAP_MEM_POOL_SIZE=131072

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# Wait for USB to enumerate before printing boot banner
CONFIG_BOOT_DELAY=3000

# Zephyr kernel event objects — required by the mesh blob's FreeRTOS shim
CONFIG_EVENTS=y

# Networking basics (required by WIFI_ESP32)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y

CONFIG_ESP32_MESH_ROUTER_SSID="TESTSSID"
CONFIG_ESP32_MESH_ROUTER_PASS="TESTPASSWORD"
CONFIG_ESP32_MESH_ID="77:77:77:77:77:77"
CONFIG_ESP32_MESH_AP_PASS="meshpass123"
CONFIG_ESP32_MESH_CHANNEL=0
CONFIG_ESP32_MESH_MAX_LAYER=6
CONFIG_ESP32_MESH_MAX_CONNECTION=6
CONFIG_ESP32_MESH_RX_THREAD_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192
